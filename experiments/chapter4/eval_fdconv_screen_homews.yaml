title: Chapter 4 DIOR-R FDConv-Lite Screening Evaluation

defaults:
  data: ultralytics/cfg/datasets/DIOR-official-homews.yaml
  split: test
  imgsz: 640
  device: 1
  workers: 8
  project: runs/obb/chapter4_fdconv_screen_eval
  out: experiments/chapter4/dior_official_fdconv_screen_eval

experiments:
  - dataset: DIOR-R
    variant: Baseline
    config: experiments/chapter4/lsknet_t_baseline_dior_official_homews.yaml
    weights:
      - weights/checkpoints/chapter4/dior_official/seed42/baseline/best.pt

  - dataset: DIOR-R
    variant: FDF
    config: experiments/chapter4/lsknet_t_fdf_dior_official_homews.yaml
    weights:
      - weights/checkpoints/chapter4/dior_official/seed42/fdf/best.pt

  - dataset: DIOR-R
    variant: FDConv-Lite
    config: experiments/chapter4/lsknet_t_fdconv_dior_official_homews.yaml

  - dataset: DIOR-R
    variant: FDConv-Lite+FDF
    config: experiments/chapter4/lsknet_t_fdconv_fdf_dior_official_homews.yaml
