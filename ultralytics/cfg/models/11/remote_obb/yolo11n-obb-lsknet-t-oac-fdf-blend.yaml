# Thesis Chapter 4 C+D v2 candidate.
# LSKNet-T backbone + OAC after channel adapters + residual-blended FDF auxiliary top-down paths.
# The original top-down route is retained as the main path; FDF is learned as a zero-start auxiliary correction.
# This model does not include Chapter 3 FSPB/LPCF modules.

nc: 80
scales:
  n: [0.50, 0.25, 1024]

backbone:
  - [-1, 1, LSKNetT, []] # 0: C2/C3/C4/C5 = 32/64/160/256 at stride 4/8/16/32
  - [0, 1, Index, [32, 0]] # 1-C2/4, recorded only for audit
  - [0, 1, Index, [64, 1]] # 2-C3/8
  - [0, 1, Index, [160, 2]] # 3-C4/16
  - [0, 1, Index, [256, 3]] # 4-C5/32
  - [2, 1, Conv, [512, 1, 1]] # 5-P3 adapter
  - [-1, 1, OrientationAwareCalibration, []] # 6-C-OAC on P3/8
  - [3, 1, Conv, [512, 1, 1]] # 7-P4 adapter
  - [-1, 1, OrientationAwareCalibration, []] # 8-C-OAC on P4/16
  - [4, 1, SPPF, [1024, 5]] # 9-P5/32
  - [-1, 2, C2PSA, [1024]] # 10-P5/32
  - [-1, 1, OrientationAwareCalibration, []] # 11-C-OAC on P5/32

head:
  # P5 -> P4: original main path plus FDF auxiliary path.
  - [11, 1, nn.Upsample, [None, 2, "nearest"]] # 12
  - [[-1, 8], 1, Concat, [1]] # 13: main cat calibrated P4
  - [-1, 2, C3k2, [512, False]] # 14: main P4td
  - [[11, 8], 1, FreqDetailFusion, []] # 15: D-FDF auxiliary P5->P4 fusion
  - [-1, 2, C3k2, [512, False]] # 16: auxiliary P4td
  - [[14, 16], 1, ResidualFeatureBlend, []] # 17: blended P4td, starts from main path

  # P4 -> P3: original main path plus FDF auxiliary path.
  - [17, 1, nn.Upsample, [None, 2, "nearest"]] # 18
  - [[-1, 6], 1, Concat, [1]] # 19: main cat calibrated P3
  - [-1, 2, C3k2, [256, False]] # 20: main P3/8-small
  - [[17, 6], 1, FreqDetailFusion, []] # 21: D-FDF auxiliary P4->P3 fusion
  - [-1, 2, C3k2, [256, False]] # 22: auxiliary P3/8-small
  - [[20, 22], 1, ResidualFeatureBlend, []] # 23: blended P3/8-small

  - [23, 1, Conv, [256, 3, 2]]
  - [[-1, 17], 1, Concat, [1]] # cat blended P4
  - [-1, 2, C3k2, [512, False]] # 26 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 11], 1, Concat, [1]] # cat calibrated P5
  - [-1, 2, C3k2, [1024, True]] # 29 (P5/32-large)

  - [[23, 26, 29], 1, OBB, [nc, 1]] # OBB(P3, P4, P5)
