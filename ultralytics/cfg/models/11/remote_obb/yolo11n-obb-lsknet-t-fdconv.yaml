# Thesis Chapter 4 C candidate.
# LSKNet-T backbone + FDConv-Lite frequency-dynamic adapter after channel adapters.
# This model does not include Chapter 3 FSPB/LPCF modules.

nc: 80
scales:
  n: [0.50, 0.25, 1024]

backbone:
  - [-1, 1, LSKNetT, []] # 0: C2/C3/C4/C5 = 32/64/160/256 at stride 4/8/16/32
  - [0, 1, Index, [32, 0]] # 1-C2/4, recorded only for audit
  - [0, 1, Index, [64, 1]] # 2-C3/8
  - [0, 1, Index, [160, 2]] # 3-C4/16
  - [0, 1, Index, [256, 3]] # 4-C5/32
  - [2, 1, Conv, [512, 1, 1]] # 5-P3 adapter
  - [-1, 1, FDConvLiteAdapter, []] # 6-C-FDConv-Lite on P3/8
  - [3, 1, Conv, [512, 1, 1]] # 7-P4 adapter
  - [-1, 1, FDConvLiteAdapter, []] # 8-C-FDConv-Lite on P4/16
  - [4, 1, SPPF, [1024, 5]] # 9-P5/32
  - [-1, 2, C2PSA, [1024]] # 10-P5/32
  - [-1, 1, FDConvLiteAdapter, []] # 11-C-FDConv-Lite on P5/32

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 8], 1, Concat, [1]] # cat frequency-adapted P4
  - [-1, 2, C3k2, [512, False]] # 14

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]] # cat frequency-adapted P3
  - [-1, 2, C3k2, [256, False]] # 17 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 14], 1, Concat, [1]] # cat head P4
  - [-1, 2, C3k2, [512, False]] # 20 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 11], 1, Concat, [1]] # cat frequency-adapted P5
  - [-1, 2, C3k2, [1024, True]] # 23 (P5/32-large)

  - [[17, 20, 23], 1, OBB, [nc, 1]] # OBB(P3, P4, P5)
