# VEDAI single-path heavy AB variant.
# A keeps a strengthened P2 branch. B-PKI is moved after P2 construction to the
# final P3/P4 neck fusion blocks, preventing B from changing P2SemanticGuard input.

nc: 80
scales:
  n: [0.50, 0.25, 1024]

backbone:
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]] # 2-P2/4
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]] # 4-P3/8
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, C3k2, [512, True]] # 6-P4/16
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 2, C3k2, [1024, True]] # 8-P5/32
  - [-1, 1, SPPF, [1024, 5]] # 9
  - [-1, 2, C2PSA, [1024]] # 10

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, False]] # 13 plain P4 for A path

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 2, C3k2, [256, False]] # 16 plain P3 for P2Guard input

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 2], 1, Concat, [1]]
  - [-1, 4, C3k2P2Guard, [256, False, 0.75]] # 19 heavy A-P2, actual 64 channels

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 16], 1, Concat, [1]]
  - [-1, 4, C3k2PKI, [384, False, 0.75]] # 22 heavy B-PKI P3, actual 96 channels

  - [-1, 1, Conv, [384, 3, 2]]
  - [[-1, 13], 1, Concat, [1]]
  - [-1, 4, C3k2PKI, [640, False, 0.75]] # 25 heavy B-PKI P4, actual 160 channels

  - [-1, 1, Conv, [640, 3, 2]]
  - [[-1, 10], 1, Concat, [1]]
  - [-1, 2, C3k2, [1024, True]] # 28 P5/32

  - [[19, 22, 25, 28], 1, OBB, [nc, 1]] # OBB(P2, P3, P4, P5)
