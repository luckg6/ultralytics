# VEDAI AB-Plus-Decoupled.
# The proven A-P2-Plus path remains unchanged. B-PKI-Lite runs in an independent
# top-down path and is injected only into final P3/P4 features through
# zero-initialized residual gates, so B cannot corrupt the P2SemanticGuard input.

nc: 80
scales:
  n: [0.50, 0.25, 1024]

backbone:
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]] # 2-P2/4
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]] # 4-P3/8
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, C3k2, [512, True]] # 6-P4/16
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 2, C3k2, [1024, True]] # 8-P5/32
  - [-1, 1, SPPF, [1024, 5]] # 9
  - [-1, 2, C2PSA, [1024]] # 10

head:
  # A-P2-Plus main path (layers 11-28 match the standalone A-Plus model).
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, False]] # 13 A-main P4

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 2, C3k2, [256, False]] # 16 A-main P3

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 2], 1, Concat, [1]]
  - [-1, 4, C3k2P2Guard, [192, False, 0.75]] # 19 A-Plus P2

  - [-1, 1, Conv, [192, 3, 2]]
  - [[-1, 16], 1, Concat, [1]]
  - [-1, 2, C3k2, [256, False]] # 22 A-main final P3

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 13], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, False]] # 25 A-main final P4

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 10], 1, Concat, [1]]
  - [-1, 2, C3k2, [1024, True]] # 28 A-main final P5

  # Independent B-PKI-Lite path from backbone semantics.
  - [10, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 2, C3k2PKI, [512, False]] # 31 B auxiliary P4

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 2, C3k2PKI, [256, False]] # 34 B auxiliary P3

  # Identity-preserving late fusion; P2 remains completely A-owned.
  - [[22, 34], 1, ResidualFeatureBlend, []] # 35 fused P3
  - [[25, 31], 1, ResidualFeatureBlend, []] # 36 fused P4
  - [[19, 35, 36, 28], 1, OBB, [nc, 1]] # OBB(P2, P3, P4, P5)
