# Thesis Chapter 4 D candidate.
# LSKNet-T backbone + frequency-aware detail fusion in the original top-down neck.
# This model does not include Chapter 3 FSPB/LPCF modules.

nc: 80
scales:
  n: [0.50, 0.25, 1024]

backbone:
  - [-1, 1, LSKNetT, []] # 0: C2/C3/C4/C5 = 32/64/160/256 at stride 4/8/16/32
  - [0, 1, Index, [32, 0]] # 1-C2/4, recorded only for audit
  - [0, 1, Index, [64, 1]] # 2-C3/8
  - [0, 1, Index, [160, 2]] # 3-C4/16
  - [0, 1, Index, [256, 3]] # 4-C5/32
  - [2, 1, Conv, [512, 1, 1]] # 5-P3 adapter: 64 -> 128 after n-width scaling
  - [3, 1, Conv, [512, 1, 1]] # 6-P4 adapter: 160 -> 128 after n-width scaling
  - [4, 1, SPPF, [1024, 5]] # 7-P5/32, original YOLO11 SPPF channel target
  - [-1, 2, C2PSA, [1024]] # 8-P5/32, original YOLO11 C2PSA channel target

head:
  - [[8, 6], 1, FreqDetailFusion, []] # 9: D-FDF top-down P5->P4 fusion
  - [-1, 2, C3k2, [512, False]] # 10

  - [[10, 5], 1, FreqDetailFusion, []] # 11: D-FDF top-down P4->P3 fusion
  - [-1, 2, C3k2, [256, False]] # 12 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 10], 1, Concat, [1]] # cat head P4
  - [-1, 2, C3k2, [512, False]] # 15 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 8], 1, Concat, [1]] # cat head P5
  - [-1, 2, C3k2, [1024, True]] # 18 (P5/32-large)

  - [[12, 15, 18], 1, OBB, [nc, 1]] # OBB(P3, P4, P5)
