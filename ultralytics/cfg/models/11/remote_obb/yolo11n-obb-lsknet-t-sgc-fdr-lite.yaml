# Thesis Chapter 4 C+D candidate.
# LSKNet-T backbone + SGC strip-guided calibration + FDR-Lite residual detail compensation.
# This model keeps the original YOLO11 neck fusion path and does not include Chapter 3 FSPB/LPCF.

nc: 80
scales:
  n: [0.50, 0.25, 1024]

backbone:
  - [-1, 1, LSKNetT, []] # 0: C2/C3/C4/C5 = 32/64/160/256 at stride 4/8/16/32
  - [0, 1, Index, [32, 0]] # 1-C2/4, recorded only for audit
  - [0, 1, Index, [64, 1]] # 2-C3/8
  - [0, 1, Index, [160, 2]] # 3-C4/16
  - [0, 1, Index, [256, 3]] # 4-C5/32
  - [2, 1, Conv, [512, 1, 1]] # 5-P3 adapter
  - [-1, 1, StripGuidedCalibration, []] # 6-C-SGC on P3/8
  - [-1, 1, FreqDetailResidual, []] # 7-D-FDR-Lite on calibrated P3/8
  - [3, 1, Conv, [512, 1, 1]] # 8-P4 adapter
  - [-1, 1, StripGuidedCalibration, []] # 9-C-SGC on P4/16
  - [-1, 1, FreqDetailResidual, []] # 10-D-FDR-Lite on calibrated P4/16
  - [4, 1, SPPF, [1024, 5]] # 11-P5/32
  - [-1, 2, C2PSA, [1024]] # 12-P5/32
  - [-1, 1, StripGuidedCalibration, []] # 13-C-SGC on P5/32
  - [-1, 1, FreqDetailResidual, []] # 14-D-FDR-Lite on calibrated P5/32

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 10], 1, Concat, [1]] # cat calibrated detail-residual P4
  - [-1, 2, C3k2, [512, False]] # 17

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 7], 1, Concat, [1]] # cat calibrated detail-residual P3
  - [-1, 2, C3k2, [256, False]] # 20 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 17], 1, Concat, [1]] # cat head P4
  - [-1, 2, C3k2, [512, False]] # 23 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 14], 1, Concat, [1]] # cat calibrated detail-residual P5
  - [-1, 2, C3k2, [1024, True]] # 26 (P5/32-large)

  - [[20, 23, 26], 1, OBB, [nc, 1]] # OBB(P3, P4, P5)
